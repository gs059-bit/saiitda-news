<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인 | 사이잇다</title>
    <!-- config.js의 supabaseUrl과 같은 주소 -->
    <link rel="preconnect" href="https://xqpyoqyteuiirpfzomny.supabase.co" crossorigin />
    <link rel="modulepreload" href="https://esm.sh/@supabase/supabase-js@2.49.8?bundle" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <main class="wrap">
      <a class="back" href="index.html"><img src="school-emblem.png" alt="" />홈으로</a>

      <!-- 로그인 (login.html) -->
      <section class="card" id="loginView">
        <img class="logo" src="logo.jpg" width="849" height="255" alt="사이잇다" />
        <h1>통합 로그인</h1>
        <form id="loginform">
          <fieldset class="roles">
            <legend>로그인 유형</legend>
            <div class="seg">
              <label><input type="radio" name="role" value="admin" /><span>관리자</span></label>
              <label><input type="radio" name="role" value="teacher" /><span>선생님</span></label>
              <label><input type="radio" name="role" value="reporter" checked /><span>학생 기자</span></label>
              <label><input type="radio" name="role" value="student" /><span>일반 학생</span></label>
            </div>
          </fieldset>
          <div class="field">
            <label for="email">이메일</label>
            <input id="email" type="email" required autocomplete="username" />
          </div>
          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" type="password" required autocomplete="current-password" />
          </div>
          <button class="btn" type="submit">로그인</button>
          <div id="msg" role="alert"></div>
        </form>
        <p class="switch">아직 계정이 없나요? <a href="#signup">회원가입</a></p>
        <p class="switch">비밀번호를 잊었나요? <a href="#forgot">비밀번호 찾기</a></p>
      </section>

      <!-- 비밀번호 찾기 (login.html#forgot): 재설정 링크를 메일로 보낸다 -->
      <section class="card hide" id="forgotView">
        <img class="logo" src="logo.jpg" width="849" height="255" alt="사이잇다" />
        <h1>비밀번호 찾기</h1>
        <form id="forgotform">
          <p class="hint">가입한 이메일을 입력하면 비밀번호를 새로 정하는 링크를 보내 드립니다.</p>
          <div class="field">
            <label for="femail">이메일</label>
            <input id="femail" type="email" required autocomplete="email" />
          </div>
          <button class="btn" type="submit">재설정 링크 보내기</button>
          <div id="fmsg" role="alert"></div>
        </form>
        <p class="switch"><a href="#">로그인으로 돌아가기</a></p>
      </section>

      <!-- 새 비밀번호 정하기 (메일의 링크 login.html?reset=1 로 들어온다) -->
      <section class="card hide" id="resetView">
        <img class="logo" src="logo.jpg" width="849" height="255" alt="사이잇다" />
        <h1>새 비밀번호 정하기</h1>
        <form id="resetform">
          <fieldset id="resetFields" class="roles">
            <div class="field">
              <label for="rpass">새 비밀번호</label>
              <input id="rpass" type="password" required minlength="8" autocomplete="new-password" />
              <span class="hint">8자 이상</span>
            </div>
            <div class="field">
              <label for="rpass2">새 비밀번호 확인</label>
              <input id="rpass2" type="password" required minlength="8" autocomplete="new-password" />
            </div>
            <button class="btn" type="submit">비밀번호 바꾸기</button>
          </fieldset>
          <div id="rmsg" role="alert"></div>
        </form>
        <p class="switch"><a href="login.html#forgot">링크를 다시 받기</a></p>
      </section>

      <!-- 회원가입 (login.html#signup) -->
      <section class="card hide" id="signupView">
        <img class="logo" src="logo.jpg" width="849" height="255" alt="사이잇다" />
        <h1>회원가입</h1>
        <form id="signupform">
          <fieldset class="roles">
            <legend>가입 유형</legend>
            <div class="seg" style="--n: 3">
              <label><input type="radio" name="srole" value="teacher" /><span>선생님</span></label>
              <label><input type="radio" name="srole" value="reporter" /><span>학생 기자</span></label>
              <label><input type="radio" name="srole" value="student" checked /><span>일반 학생</span></label>
            </div>
          </fieldset>
          <p class="hint">가입 신청은 관리자가 확인하고 승인한 뒤 로그인할 수 있습니다.</p>
          <p class="notice ok hide" id="teacherNote">
            선생님 계정은 최고 관리자가 직접 만들어 드립니다. 사이잇다 운영진에게 요청해 주세요.
          </p>
          <fieldset id="signupFields" class="roles">
            <div class="field">
              <label for="sname">이름</label>
              <input id="sname" required maxlength="40" autocomplete="name" />
            </div>
            <div class="field">
              <label for="semail">이메일</label>
              <input id="semail" type="email" required autocomplete="email" />
            </div>
            <div class="field">
              <label for="spass">비밀번호</label>
              <input id="spass" type="password" required minlength="8" autocomplete="new-password" />
              <span class="hint">8자 이상</span>
            </div>
            <div class="field">
              <label for="spass2">비밀번호 확인</label>
              <input id="spass2" type="password" required minlength="8" autocomplete="new-password" />
            </div>
            <label class="agree"
              ><input type="checkbox" id="agreePrivacy" required /><span
                >(필수) 개인정보 수집·이용에 동의합니다.
                <a href="privacy.html" target="_blank" rel="noopener">개인정보처리방침 보기</a></span
              ></label
            >
            <label class="agree"
              ><input type="checkbox" id="agreeGuardian" required /><span
                >(필수) 만 14세 미만 학생은 보호자의 동의를 받았습니다.</span
              ></label
            >
            <button class="btn" type="submit">가입 신청</button>
          </fieldset>
          <div id="smsg" role="alert"></div>
        </form>
        <p class="switch">이미 계정이 있나요? <a href="#">로그인</a></p>
      </section>
    </main>
    <script src="config.js"></script>
    <script type="module" src="js/login.js"></script>
  </body>
</html>
