:root{--ink:#17191d;--muted:#5f6b75;--line:#e0e2e5;--blue:#0067bd;--soft:#f5f6f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:var(--soft);font-family:'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif}button,input{font:inherit}a{color:inherit;text-decoration:none}
.wrap{max-width:460px;margin:0 auto;padding:28px 16px 48px;display:flex;flex-direction:column;gap:18px}

.seg input:checked+span{background:var(--ink);color:white}.seg input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:7px;margin:16px 0}.field label{font-weight:700;font-size:14px}.field input{width:100%;padding:12px;border:1px solid #bdc5cb;border-radius:6px;background:white}.hint{font-size:12px;color:var(--muted)}
.agree{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:14px;line-height:1.6}.agree input{width:20px;height:20px;margin:2px 0 0;flex-shrink:0}.agree a{color:var(--blue);text-decoration:underline}

</style></head><body><main class="wrap"><a class="back" href="index.html"><img src="school-emblem.png" alt="">← 사이잇다 홈으로</a>
<section class="card" id="loginView"><img class="logo" src="logo.jpg" width="849" height="255" alt="사이잇다"><h1>통합 로그인</h1><form id="loginform"><fieldset class="roles"><legend>로그인 유형</legend><div class="seg"><label><input type="radio" name="role" value="admin"><span>관리자</span></label><label><input type="radio" name="role" value="teacher"><span>선생님</span></label><label><input type="radio" name="role" value="reporter" checked><span>학생 기자</span></label><label><input type="radio" name="role" value="student"><span>일반 학생</span></label></div></fieldset><div class="field"><label for="email">이메일</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label for="password">비밀번호</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn" type="submit">로그인</button><div id="msg" role="alert"></div></form><p class="switch">아직 계정이 없나요? <a href="#signup">회원가입</a></p></section>

</main><script src="config.js"></script><script type="module" src="login.js"></script></body></html>
