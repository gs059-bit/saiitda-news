<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 학교 이름이 들어간 문구는 js/app.js가 config.js의 schoolName으로 바꿔 넣는다 -->
    <meta name="description" content="강서초등학교 어린이 기자단 웹진 사이잇다" />
    <title>사이잇다 | 강서초등학교 어린이 기자단 웹진</title>
    <!-- 카카오톡 등 링크 미리보기. 미리보기 봇은 자바스크립트를 실행하지 않으므로 학교 이름·주소를 여기 직접 쓴다.
         이미지 주소는 전체 주소(https://...)여야 한다. 고친 뒤에는 카카오 공유 디버거에서 캐시를 지운다 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="사이잇다" />
    <meta property="og:title" content="사이잇다 | 강서초등학교 어린이 기자단 웹진" />
    <meta property="og:description" content="우리 사이의 이야기를 찾아, 세상과 잇다" />
    <meta property="og:url" content="https://saiitda-news.vercel.app/" />
    <meta property="og:image" content="https://saiitda-news.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- config.js의 supabaseUrl과 같은 주소 (Supabase 프로젝트를 바꾸면 README의 목록을 따라 함께 바꾼다) -->
    <link rel="preconnect" href="https://xqpyoqyteuiirpfzomny.supabase.co" crossorigin />
    <link rel="modulepreload" href="https://esm.sh/@supabase/supabase-js@2.49.8?bundle" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="utility">
      <div class="shell">
        <a class="brand" href="#/" aria-label="사이잇다 홈">
          <img src="school-emblem.png" alt="강서초등학교 교표" id="emblem" />
          <span><strong data-school>강서초등학교</strong><small>어린이 기자단 웹진</small></span>
        </a>
        <div class="actions">
          <span id="weather" class="weather" hidden></span>
          <span id="userbar"></span>
          <button id="meBtn" class="pill" hidden>내 정보</button>
          <button id="authBtn" class="pill">로그인</button>
          <button id="logoutBtn" class="pill" hidden>로그아웃</button>
        </div>
      </div>
    </div>

    <header class="masthead shell">
      <a href="#/" aria-label="사이잇다 홈"
        ><img src="logo.jpg" width="849" height="255" alt="사이잇다 — 우리 사이의 이야기를 찾아, 세상과 잇다"
      /></a>
      <p class="tagline hide" id="tagline" aria-hidden="true"></p>
      <p class="subline">학생 기자들이 직접 취재하고 기록하는 우리 학교의 이야기</p>
    </header>

    <nav class="nav"><div class="shell" id="nav"></div></nav>

    <!-- js/app.js가 주소(#/...)에 맞는 화면을 여기에 그린다 -->
    <main class="shell" id="app"></main>

    <footer class="footer">
      <div class="shell footgrid">
        <div>
          <strong>사이잇다</strong> · <span data-school>강서초등학교</span> 어린이 기자단 웹진<br />
          학생 기자들이 직접 취재하고 기록하는 우리 학교의 이야기<br />
          기사에 등장하는 학생의 사진과 개인정보는 게시 전 학교 지침에 따라 확인합니다.
        </div>
        <div class="footinfo">
          <a class="privacy" href="privacy.html">개인정보처리방침</a>
          <span>운영 주체: <span data-school>강서초등학교</span> 어린이 기자단</span>
          <span>문의처: <span id="footContact"></span></span>
          <span
            >날씨 정보: <a href="https://open-meteo.com/" rel="noopener">Open-Meteo.com</a> · 미세먼지: Copernicus
            CAMS</span
          >
          <span
            >ⓒ <span id="year">2026</span> <span data-school>강서초등학교</span> 어린이 기자단. 기사와 사진의 무단 전재
            및 재배포를 금지합니다.</span
          >
        </div>
      </div>
    </footer>

    <script src="config.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
